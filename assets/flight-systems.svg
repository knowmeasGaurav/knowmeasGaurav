<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-labelledby="t d">
<title id="t">Flight systems: how I wire a Flutter app</title>
<desc id="d">Animated schematic of a Flutter app using the BLoC pattern. A tap in the UI sends an event to the BLoC, the BLoC fetches from a repository, the repository reads from a remote API and a local cache, data flows back, the BLoC emits a new state and the UI rebuilds.</desc>
