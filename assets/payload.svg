<title id="t">Payload: Flutter, Dart, BLoC, C++, Python</title>
<desc id="d">A payload bay with five modules docking one after another. Flutter is the primary module, every screen I ship. Dart runs it. BLoC keeps state predictable. C++ for systems work like the shell. Python for agents and AI.</desc>
